@if (loading()) {
    <p-progress-spinner />
} @else {
    <p-card>
        <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="field">
                <label for="title">Titre</label>
                <input formControlName="title" id="title" type="text" pInputTextarea class="w-full">
                <small class="invalid-feedback">Le titre est requis (max 30 carac.)</small>
            </div>
    
            <div class="field">
                <label for="content">Contenu</label>
                <textarea formControlName="content" id="content" pTextarea class="w-full"></textarea>
                <small class="invalid-feedback">Le contenu est requis</small>
            </div>
    
            <div class="field">
                <label for="category">Catégorie</label>
    
                <p-select
                    formControlName="categoryId"
                    inputId="category"
                    class="w-full"
                    [options]="categories()"
                    optionLabel="name"
                    optionValue="id"
                />
    
                 <small class="invalid-feedback">La catégorie est requis</small>
            </div>
    
            <div class="flex justify-content-end gap-2">
                @if (promptId()) {
                    <button type="button" [loading]="deleting()" [outlined]="true" class="mr-auto" pButton severity="danger" (click)="deletePrompt()">Supprimer</button>
                }
                <button routerLink="/" pButton severity="secondary">Annuler</button>
                <button pButton type="submit" [loading]="submitting()">{{ promptId() ? "Modifier" : "Créer"}}</button>
            </div>
        </form>
    </p-card>
}
